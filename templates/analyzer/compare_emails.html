{% extends 'analyzer/base.html' %}

{% block content %}
<h1>Compare Emails</h1>

<div class="comparison">
    {% for email in emails %}
        <section class="email-column">
            <strong>Email #{{ email.id }}</strong>
            <span class="status-badge status-{{ email.status }}">{{ email.status }}</span>
            <pre>{{ email.header|truncatechars:100 }}</pre>
            <pre>{{ email.body|truncatechars:1024 }}</pre>
            <br>
            <br>
            <div class="email-actions">
                <a href="{% url 'email_results' email.id %}">
                    <button type="button">View Results</button>
                </a>
                <form method="post" action="{% url 'delete_email' email.id %}" onsubmit="return confirm('Are you sure you want to delete this email?');">
                    {% csrf_token %}
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </div>
        </section>
    {% empty %}
        <p>No emails found.</p>
    {% endfor %}
</div>

<br>

<a href="{% url 'home_view' %}"><button class="button">Back to Analyzer</button></a>
<a href="{% url 'past_emails' %}"><button class="button">Past Emails Analyzed</button></a>
<a href="/welcome/"><button class="button">Main Menu</button></a>

{% endblock %}
